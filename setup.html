<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SimplyStremio setup — choose your streaming provider.">
  <title>SimplyStremio — Setup</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111315; --panel: #1a1d20; --text: #f3f4f6;
      --muted: #a7adb4; --accent: #f0b35a; --border: #30343a; --border-hover: #555b63;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 12px 0 12px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 56px; }
    .brand { font-size: 14px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
    .step { font-size: 13px; color: var(--muted); }
    .progress { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; height: 3px; margin-bottom: 48px; }
    .progress-step { display: block; height: 100%; border-radius: 99px; background: var(--border); }
    .progress-step.active { background: var(--accent); }
    h1 { margin: 0 0 12px; font-size: clamp(36px, 7vw, 56px); line-height: 1; }
    .intro { margin: 0; max-width: 620px; color: var(--muted); font-size: 20px; line-height: 1.5; }
    .choices { display: grid; gap: 12px; margin-top: 36px; }
    .choice { display: block; width: 100%; padding: 20px 22px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); color: var(--text); text-align: left; font: inherit; cursor: pointer; transition: border-color .15s ease, transform .15s ease; }
    .choice:hover { border-color: var(--border-hover); transform: translateY(-1px); }
    .choice strong { display: block; font-size: 18px; }
    .choice span { display: block; margin-top: 5px; color: var(--muted); font-size: 14px; line-height: 1.4; }
    .choice.selected { border-color: var(--accent); }
    .provider-note { margin-top: 24px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .continue { display: block; width: 100%; margin-top: 24px; padding: 14px 20px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--muted); font: inherit; font-weight: 700; cursor: not-allowed; }
    .continue.ready { border-color: var(--accent); background: var(--accent); color: #17120b; cursor: pointer; }
    footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
    @media (max-width: 600px) { main { padding: 12px 0 12px; } .topbar { margin-bottom: 40px; } .progress { margin-bottom: 40px; } .choice { padding: 18px; } }
  </style>
</head>
<body>
  <main>
    <div class="topbar"><div class="brand">SimplyStremio</div><div class="step">Step 1 of 4</div></div>
    <div class="progress" aria-hidden="true">
      <span class="progress-step active"></span>
      <span class="progress-step"></span>
      <span class="progress-step"></span>
      <span class="progress-step"></span>
    </div>
    <h1>What do you use for your streams?</h1>
    <p class="intro">Choose the service you already have. We'll handle the technical details for you.</p>
    <div class="choices">
      <button class="choice" type="button" data-provider="torbox"><strong>TorBox</strong><span>I already have a TorBox account.</span></button>
      <button class="choice" type="button" data-provider="real-debrid"><strong>Real-Debrid</strong><span>I already have a Real-Debrid account.</span></button>
      <button class="choice" type="button" data-provider="another"><strong>Another service</strong><span>I use a different compatible debrid service.</span></button>
      <button class="choice" type="button" data-provider="none"><strong>I don't have one yet</strong><span>Show me what I need before we continue.</span></button>
    </div>
    <p class="provider-note">Your choice doesn't lock you in. You can change it later.</p>
    <button class="continue" id="continueButton" type="button" disabled>Continue →</button>
    <footer>SimplyStremio is a configuration tool. It does not provide or host media.</footer>
  </main>
  <script>
    const choices = document.querySelectorAll(".choice");
    const continueButton = document.querySelector("#continueButton");
    let selectedProvider = null;

    choices.forEach((choice) => {
      choice.addEventListener("click", () => {
        choices.forEach((item) => item.classList.remove("selected"));
        choice.classList.add("selected");
        selectedProvider = choice.dataset.provider;
        continueButton.disabled = false;
        continueButton.classList.add("ready");
      });
    });

    continueButton.addEventListener("click", () => {
      if (!selectedProvider) return;
      window.location.href = "setup-next.html?provider=" + encodeURIComponent(selectedProvider);
    });
  </script>
</body>
</html>
