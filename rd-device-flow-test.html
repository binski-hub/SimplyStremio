<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real-Debrid Device Flow Test</title>
  <style>
    body { margin: 40px; font-family: system-ui, sans-serif; background: #111315; color: #f3f4f6; line-height: 1.5; }
    main { max-width: 680px; margin: 0 auto; }
    button { padding: 12px 16px; font: inherit; cursor: pointer; margin: 6px 6px 6px 0; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .code { font-size: 2rem; letter-spacing: .12em; margin: 20px 0; }
    pre { white-space: pre-wrap; background: #191c20; padding: 16px; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Real-Debrid device flow test</h1>
    <p>This temporary page tests the browser-side open-source Real-Debrid device flow. Nothing is stored permanently.</p>

    <button id="start">Get device code</button>
    <div id="flow" hidden>
      <p>Enter this code at Real-Debrid:</p>
      <div class="code" id="userCode"></div>
      <button id="authorize">Open Real-Debrid</button>
      <button id="check">Check authorisation</button>
    </div>

    <pre id="result">Waiting...</pre>
  </main>

  <script>
    const clientId = "X245A4XAIBGVM";
    const result = document.querySelector("#result");
    const flow = document.querySelector("#flow");
    const userCode = document.querySelector("#userCode");
    const startButton = document.querySelector("#start");
    const authorizeButton = document.querySelector("#authorize");
    const checkButton = document.querySelector("#check");

    let deviceCode = "";
    let directVerificationUrl = "";

    startButton.addEventListener("click", async () => {
      result.textContent = "Requesting device code...";

      try {
        const response = await fetch(
          "https://api.real-debrid.com/oauth/v2/device/code?client_id=" +
          encodeURIComponent(clientId) +
          "&new_credentials=yes"
        );

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        deviceCode = data.device_code;
        directVerificationUrl = data.direct_verification_url;

        userCode.textContent = data.user_code;
        flow.hidden = false;
        result.textContent =
          "Device code received.\n\n" +
          "The next test is whether browser JavaScript can check the device status.";
      } catch (error) {
        result.textContent =
          "BROWSER REQUEST FAILED\n\n" + error;
      }
    });

    authorizeButton.addEventListener("click", () => {
      if (!directVerificationUrl) return;
      window.location.href = directVerificationUrl;
    });

    checkButton.addEventListener("click", async () => {
      if (!deviceCode) return;

      result.textContent = "Checking authorisation...";

      try {
        const response = await fetch(
          "https://api.real-debrid.com/oauth/v2/device/credentials?client_id=" +
          encodeURIComponent(clientId) +
          "&code=" +
          encodeURIComponent(deviceCode)
        );

        const text = await response.text();

        result.textContent =
          "HTTP " + response.status + "\n\n" + text;
      } catch (error) {
        result.textContent =
          "BROWSER REQUEST FAILED\n\n" + error;
      }
    });
  </script>
</body>
</html>
