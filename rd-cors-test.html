<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real-Debrid Connection Test</title>
  <style>
    body { margin: 40px; font-family: system-ui, sans-serif; background: #111315; color: #f3f4f6; }
    button { padding: 12px 16px; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Real-Debrid browser test</h1>
  <p>This temporary page checks whether GitHub Pages can call the Real-Debrid device endpoint directly.</p>
  <button id="test">Test connection</button>
  <pre id="result">Waiting...</pre>

  <script>
    const result = document.querySelector("#result");

    document.querySelector("#test").addEventListener("click", async () => {
      result.textContent = "Requesting device code...";

      try {
        const response = await fetch(
          "https://api.real-debrid.com/oauth/v2/device/code?client_id=X245A4XAIBGVM&new_credentials=yes"
        );

        const text = await response.text();
        result.textContent =
          "HTTP " + response.status + "\n\n" + text;
      } catch (error) {
        result.textContent =
          "BROWSER REQUEST FAILED\n\n" + error;
      }
    });
  </script>
</body>
</html>
